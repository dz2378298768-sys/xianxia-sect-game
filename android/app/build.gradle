apply plugin: 'com.android.application'

android {
    namespace = "com.xianxia.sectgame"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.xianxia.sectgame"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 版本号支持通过 Gradle 属性覆盖（用于一次代码生成多个版本）：
        //   打 1.6 测试包：cd android && ./gradlew assembleRelease -PVERSION_CODE=6 -PVERSION_NAME=1.6
        //   打 1.10.0 正式包：cd android && ./gradlew assembleRelease -PVERSION_CODE=10 -PVERSION_NAME=1.10.0
        // 若不传属性，则使用下面默认的 1.10.0 版本。
        versionCode project.hasProperty("VERSION_CODE") ? project.property("VERSION_CODE").toInteger() : 10
        versionName project.hasProperty("VERSION_NAME") ? project.property("VERSION_NAME").toString() : "1.10.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Release 签名：文件放在 android/app/xianxia-release.keystore
        // 密码建议通过 ~/.gradle/gradle.properties 注入（项目外变量），此处读取不到时再用默认值，
        // 这样可以避免把密码直接提交到代码仓库。
        release {
            storeFile     file(project.findProperty("XIANXIA_STORE_FILE") ?: "xianxia-release.keystore")
            storePassword (project.findProperty("XIANXIA_STORE_PASSWORD") ?: "Xianxia2026!")
            keyAlias      (project.findProperty("XIANXIA_KEY_ALIAS") ?: "xianxia")
            keyPassword   (project.findProperty("XIANXIA_KEY_PASSWORD") ?: "Xianxia2026!")
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs', 'src/main/libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // === Dirichlet 聚合 SDK（激励视频 · 含穿山甲 + 优量汇双 Adapter） ===============================
    // 官方下载页：https://ssp.dirichlet.cn/docs/resource-download/
    // 当前版本：4.2.8.3（2026-07-28 发布）
    // 把以下 3 个 AAR 放入 app/src/main/libs/ 目录即可自动启用：
    //   1. DirichletAD_Mediation_4.2.8.3.aar   (Dirichlet 聚合 SDK，含 Dirichlet 广告 SDK)
    //   2. DirichletAD_CSJ_Adapter_4.2.8.3.aar (穿山甲 Adapter)
    //   3. DirichletAD_GDT_Adapter_4.2.8.3.aar (优量汇 Adapter)
    // 缺 AAR 时 DirichletAd.java 会自动降级，不影响游戏其他流程。
    def libsDir = file("src/main/libs")
    if (libsDir.exists() && libsDir.listFiles()?.any { it.name.toLowerCase().endsWith(".aar") }) {
        // —— Dirichlet 聚合 3 个 AAR ——
        implementation(name: "DirichletAD_Mediation_4.2.8.3", ext: "aar")
        implementation(name: "DirichletAD_CSJ_Adapter_4.2.8.3", ext: "aar")
        implementation(name: "DirichletAD_GDT_Adapter_4.2.8.3", ext: "aar")
        // —— 穿山甲（Pangle）广告 SDK ——
        implementation('com.pangle.cn:ads-sdk-pro:7.6.1.2') {
            exclude group: 'com.android.support'
        }
        // —— 优量汇（GDT）广告 SDK ——
        implementation 'com.qq.e.union:union:4.690.1560'
        // —— Dirichlet 聚合 SDK 运行时所需第三方依赖 ——
        implementation 'com.squareup.okhttp3:okhttp:3.12.1'
        implementation "com.github.bumptech.glide:glide:4.9.0"
        // SDK 内部仍引用 support 库，AndroidX 工程通过 jetifier 自动转换
        implementation "com.android.support:appcompat-v7:28.0.0"
        implementation "com.android.support:support-annotations:28.0.0"
        implementation "com.android.support:support-v4:28.0.0"
        implementation 'com.android.support:recyclerview-v7:28.0.0'
        logger.lifecycle("DirichletAd: 检测到 AAR 文件，启用「聚合 SDK + 穿山甲 + 优量汇」真实依赖")
    } else {
        logger.lifecycle("DirichletAd: 未检测到 AAR 文件，激励视频将使用 Mock 模式（请将 DirichletAD_*.aar 共 3 个放入 app/src/main/libs/）")
    }
    // ========================================================================================

    // === TapTap SDK v4 =====================================================================
    // TapSDK v4 核心包 + 登录模块（始终启用，独立于更新模块）
    // 文档：https://developer.taptap.cn/docs/sdk/taptap-login/guide/
    implementation "com.taptap.sdk:tap-core:4.10.8"
    implementation "com.taptap.sdk:tap-login:4.10.8"

    // === TapTap 更新唤起 SDK v4 ==============================================================
    // 官方文档：https://developer.taptap.cn/docs/sdk/update/guide/
    // 功能：APK 上传到 TapTap 开发者中心并设置强制更新后，SDK 会自动唤起 TapTap 商店更新页。
    // 通过 TAP_UPDATE_ENABLED 环境变量可控制是否启用该模块：
    //   gradlew assembleDebug -PTAP_UPDATE_ENABLED=true   （拉取 TapSDK 依赖）
    //   默认：true，若不需要更新功能可传 -PTAP_UPDATE_ENABLED=false 跳过。
    def tapUpdateEnabled = project.hasProperty('TAP_UPDATE_ENABLED') ? project.property('TAP_UPDATE_ENABLED').toBoolean() : true
    if (tapUpdateEnabled) {
        implementation "com.taptap.sdk:tap-update:4.10.8"
        // 官方 FAQ 列出的更新模块依赖（Unity 会自动注入，原生 Android 手动列出）
        implementation 'com.squareup.okhttp3:okhttp:3.12.1'
        implementation "androidx.core:core:1.6.0"
        implementation "com.google.android.flexbox:flexbox:3.0.0"
        logger.lifecycle("TapUpdate: 已启用 TapTap 更新唤起 SDK v4.10.8")
    } else {
        logger.lifecycle("TapUpdate: 未启用 TapTap 更新唤起 SDK（启用：-PTAP_UPDATE_ENABLED=true）")
    }
    // ========================================================================================

    // === TapTap 排行榜 v4 ======================================================================
    // 官方文档：https://developer.taptap.cn/docs/sdk/leaderboard/guide/
    // 功能：TapTap 服务器托管的排行榜，支持多种排序方式、好友榜、全局榜、分享功能
    // 注意：必须使用 tap-leaderboard-androidx（含 AndroidX UI 实现），而非 tap-leaderboard（仅 API）
    //       tap-leaderboard-androidx 会传递依赖 tap-leaderboard，无需重复引入
    implementation "com.taptap.sdk:tap-leaderboard-androidx:4.10.8"
    logger.lifecycle("TapLeaderboard: 已启用 TapTap 排行榜 SDK v4.10.8 (AndroidX)")
    // ========================================================================================
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
