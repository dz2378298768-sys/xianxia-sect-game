# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Dirichlet Ad SDK 内部依赖 com.android.support:*，启用 Jetifier 自动转换为 AndroidX
android.enableJetifier=true

# === 国内网络环境优化：减少超时等待 ===
org.gradle.internal.http.connectionTimeout=60000
org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.http.connection.timeout=60000
systemProp.org.gradle.internal.http.socket.timeout=60000
systemProp.http.keepAlive=true
systemProp.https.keepAlive=true
# 强制使用 IPv4，避免 IPv6 连接超时
systemProp.java.net.preferIPv4Stack=true

# === HTTP/HTTPS 代理（沙箱环境需通过 127.0.0.1:18080 代理访问外网 Maven 仓库）===
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|.svc|.cluster.local|::1

# === 本地环境差异配置（JDK / SDK / 代理 / 内存）参考 gradle.properties.example ===
# 本机定制建议写在 gradle.properties.example 里描述的位置，或直接追加到本文件末尾（不要提交本机绝对路径）：
#   - org.gradle.java.home=（JDK 21+，Capacitor 8 要求 sourceCompatibility 21）
#   - org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
#   - systemProp.http(s).proxyHost / proxyPort（受限网络环境才需要）
# Android SDK 路径建议写在 android/local.properties 的 sdk.dir=，参考 local.properties.example
