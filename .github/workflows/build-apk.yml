name: Build Android APK

# 每次推送到 main 分支自动打包 APK；也可在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22（Capacitor 8 CLI 要求 >=22）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 安装 JDK 21（Capacitor 8 / AGP 8 要求；cap sync 会将 capacitor.build.gradle 编译目标生成为 VERSION_21，JDK 17 javac 无法编译到 release 21）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 配置 Gradle（缓存发行版与依赖，避免重复下载）
        uses: gradle/actions/setup-gradle@v4

      - name: 安装 Android SDK（compileSdk 36）
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: 构建 Web 资源
        run: npm run build

      - name: 同步 Web 资源到 Android 项目
        # 使用 sync 而非 copy：copy 仅拷贝 web 资源，不会生成 capacitor-cordova-android-plugins
        # 原生插件模块，会导致 Gradle 报 cordova.variables.gradle does not exist。
        run: npx cap sync android

      - name: 打包 Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: xianxia-sect-game-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
